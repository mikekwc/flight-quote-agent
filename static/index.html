<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flight Quote Agent</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1117;
      color: #e8eaf0;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: #16181f;
      border-bottom: 1px solid #2a2d3a;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: .02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    header h1 span.icon { font-size: 1.2rem; }

    button#reset-btn {
      font-size: .78rem;
      padding: 5px 12px;
      border-radius: 6px;
      border: 1px solid #3a3d4e;
      background: transparent;
      color: #8b90a8;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    button#reset-btn:hover { background: #2a2d3a; color: #e8eaf0; }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .msg {
      display: flex;
      padding: 0 20px;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
    }

    .msg.user { justify-content: flex-end; }
    .msg.assistant { justify-content: flex-start; }

    .bubble {
      max-width: 78%;
      padding: 11px 15px;
      border-radius: 16px;
      line-height: 1.55;
      font-size: .92rem;
    }

    .msg.user .bubble {
      background: #2563eb;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg.assistant .bubble {
      background: #1e2030;
      border: 1px solid #2a2d3a;
      border-bottom-left-radius: 4px;
      color: #dde1f0;
    }

    /* Markdown styles inside assistant bubble */
    .bubble h1,.bubble h2,.bubble h3 { margin: .6em 0 .3em; font-size: 1em; color: #e8eaf0; }
    .bubble h3 { color: #a5b4fc; }
    .bubble p { margin-bottom: .5em; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble ul,.bubble ol { padding-left: 1.3em; margin-bottom: .5em; }
    .bubble li { margin-bottom: .15em; }
    .bubble strong { color: #e8eaf0; }
    .bubble a { color: #60a5fa; text-decoration: none; }
    .bubble a:hover { text-decoration: underline; }
    .bubble hr { border: none; border-top: 1px solid #2a2d3a; margin: .6em 0; }

    .bubble table {
      border-collapse: collapse;
      width: 100%;
      font-size: .85rem;
      margin: .5em 0;
    }
    .bubble th {
      background: #12141c;
      color: #a5b4fc;
      font-weight: 600;
      text-align: left;
      padding: 6px 10px;
      border: 1px solid #2a2d3a;
    }
    .bubble td {
      padding: 5px 10px;
      border: 1px solid #2a2d3a;
      vertical-align: top;
    }
    .bubble tr:nth-child(even) td { background: #181a24; }

    .bubble code {
      background: #12141c;
      border-radius: 4px;
      padding: 1px 5px;
      font-size: .85em;
      font-family: "Fira Code", monospace;
    }

    /* Thinking indicator */
    .thinking .bubble {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 14px 18px;
    }
    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #4f5470;
      animation: bounce .9s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: .15s; }
    .dot:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce {
      0%,80%,100% { transform: translateY(0); }
      40% { transform: translateY(-6px); }
    }

    form#chat-form {
      flex-shrink: 0;
      padding: 12px 20px 18px;
      background: #0f1117;
      border-top: 1px solid #2a2d3a;
    }

    .input-row {
      display: flex;
      gap: 8px;
      max-width: 820px;
      margin: 0 auto;
    }

    textarea#msg-input {
      flex: 1;
      resize: none;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid #2a2d3a;
      background: #16181f;
      color: #e8eaf0;
      font-size: .92rem;
      font-family: inherit;
      line-height: 1.45;
      max-height: 140px;
      overflow-y: auto;
      outline: none;
      transition: border-color .15s;
    }
    textarea#msg-input:focus { border-color: #2563eb; }
    textarea#msg-input::placeholder { color: #4f5470; }

    button#send-btn {
      align-self: flex-end;
      padding: 11px 20px;
      border-radius: 10px;
      border: none;
      background: #2563eb;
      color: #fff;
      font-size: .92rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, opacity .15s;
      white-space: nowrap;
    }
    button#send-btn:hover { background: #1d4ed8; }
    button#send-btn:disabled { opacity: .45; cursor: default; }

    .hint {
      text-align: center;
      font-size: .75rem;
      color: #3a3d4e;
      margin-top: 6px;
      max-width: 820px;
      margin-left: auto;
      margin-right: auto;
    }

    /* Scrollbar */
    #messages::-webkit-scrollbar { width: 6px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: #2a2d3a; border-radius: 3px; }
  </style>
</head>
<body>

<header>
  <h1><span class="icon">✈️</span> Flight Quote Agent</h1>
  <button id="reset-btn">New conversation</button>
</header>

<div id="messages">
  <div class="msg assistant">
    <div class="bubble">
      Hi! I can search and compare flights for you. Try something like:<br><br>
      <strong>"Flights from Singapore to Tokyo next Saturday"</strong><br>
      <strong>"Cheapest options from KL to Bangkok in July"</strong>
    </div>
  </div>
</div>

<form id="chat-form">
  <div class="input-row">
    <textarea id="msg-input" rows="1" placeholder="Ask about flights…"></textarea>
    <button id="send-btn" type="submit">Send</button>
  </div>
  <p class="hint">Press Enter to send &nbsp;·&nbsp; Shift+Enter for new line</p>
</form>

<script>
  const messagesEl = document.getElementById("messages");
  const form = document.getElementById("chat-form");
  const input = document.getElementById("msg-input");
  const sendBtn = document.getElementById("send-btn");

  marked.setOptions({ breaks: true });

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function appendMessage(role, text, isMarkdown = false) {
    const wrap = document.createElement("div");
    wrap.className = `msg ${role}`;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    if (isMarkdown) {
      bubble.innerHTML = marked.parse(text);
    } else {
      bubble.textContent = text;
    }
    wrap.appendChild(bubble);
    messagesEl.appendChild(wrap);
    scrollToBottom();
    return wrap;
  }

  function addThinking() {
    const wrap = document.createElement("div");
    wrap.className = "msg assistant thinking";
    wrap.innerHTML = `<div class="bubble"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
    messagesEl.appendChild(wrap);
    scrollToBottom();
    return wrap;
  }

  // Auto-grow textarea
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 140) + "px";
  });

  // Enter to send, Shift+Enter for newline
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    input.value = "";
    input.style.height = "auto";
    sendBtn.disabled = true;

    appendMessage("user", text);
    const thinking = addThinking();

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text }),
      });
      const data = await res.json();
      thinking.remove();
      if (data.reply) {
        appendMessage("assistant", data.reply, true);
      } else {
        appendMessage("assistant", "Sorry, something went wrong.");
      }
    } catch {
      thinking.remove();
      appendMessage("assistant", "Could not reach the server. Is it running?");
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });

  document.getElementById("reset-btn").addEventListener("click", async () => {
    await fetch("/reset", { method: "POST" });
    messagesEl.innerHTML = `
      <div class="msg assistant">
        <div class="bubble">
          Conversation reset. How can I help you find flights?
        </div>
      </div>`;
  });

  input.focus();
</script>
</body>
</html>
